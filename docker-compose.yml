services:
  cyrus-imap:
    build: .
    image: cyrus-imap:local
    ports:
      - "143:143"
      - "993:993"
    environment:
      TLS_CN: ${TLS_CN:-localhost}
    volumes:
      - ./config/imapd.conf:/etc/imapd.conf:ro
      - ./config/cyrus.conf:/etc/cyrus.conf:ro
      - cyrus_data:/var/lib/cyrus
      - cyrus_spool:/var/spool/cyrus
      - cyrus_tls:/etc/cyrus/tls
      # To use your own certificate instead of the generated self-signed one,
      # bind-mount it here as server.crt/server.key and drop the cyrus_tls volume above.
      # - ./certs:/etc/cyrus/tls
    restart: unless-stopped

volumes:
  cyrus_data:
  cyrus_spool:
  cyrus_tls:
