services:
  cyrus-imap:
    build: .
    image: cyrus-imap:local
    ports:
      - "143:143"
      - "993:993"
    environment:
      TLS_CN: ${TLS_CN:-localhost}
    volumes:
      - ./config/imapd.conf:/etc/imapd.conf:ro
      - ./config/cyrus.conf:/etc/cyrus.conf:ro
      - ./data/lib:/var/lib/cyrus
      - ./data/spool:/var/spool/cyrus
      - ./data/tls:/etc/cyrus/tls
      # To use your own certificate instead of the generated self-signed one,
      # just drop server.crt/server.key directly into ./data/tls.
    restart: unless-stopped
